[package]
name = "tsfast"
version = "0.1.0"
edition = "2024"

[lib]
name = "tsfast"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.28.3" }
ndarray = { version = "0.16", features = ["rayon"] }
num-traits = "0.2"
rayon = "1.10"
arrow = { version = "58.1.0", features = ["pyarrow"] }
smallvec = "1.10"
realfft = "3.5.0"
rustc-hash = "2.1.3"
bitflags = "2"

[features]
extension-module = ["pyo3/extension-module"]
default = []

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "feature_benchmarks"
harness = false
