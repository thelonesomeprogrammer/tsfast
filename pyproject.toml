[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "tsfast"
requires-python = ">=3.8"
dependencies = [
    "maturin[zig]>=1.13.1",
    "numpy>=1.20",
    "pandas>=2.0.3",
    "pytest>=8.3.5",
    "pytest-benchmark>=4.0.0",
    "scipy>=1.10.0",
    "tsfel>=0.2.0",
    "tsfresh>=0.20.3",
    "ziglang>=0.15.2",
]
dynamic = ["version"]

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "tsfast._tsfast"

[tool.uv]
# uv builds the Rust extension itself (editable install into ./tsfast/).
# Rebuild whenever Rust sources change, and always in release mode, so
# `uv run ...` never tests a stale or debug build. Don't use `maturin develop`.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "Cargo.toml" },
    { file = "Cargo.lock" },
    { file = "rust-toolchain.toml" },
    { file = "src/**/*.rs" },
]

[tool.uv.config-settings-package]
tsfast = { "maturin.build-args" = "--profile=release" }

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "benchmark: mark test as a benchmark"
]

